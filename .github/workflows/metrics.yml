name: Metrics

# Runs on a predictable daily cadence and on explicit operator request rather
# than on every push to main, since a single calculation takes ~10 minutes
# and stacked-PR merges previously produced many redundant runs (issue #1015).
# See docs/feature-status.md ("Metrics and intervention-rate reporting") for
# the resulting freshness contract.
on:
  workflow_dispatch: {}
  schedule:
    # 03:17 UTC daily — a non-round minute to avoid contending with other
    # scheduled jobs that fire on the hour.
    - cron: '17 3 * * *'

# A single, stable lane shared by both triggers (schedule and
# workflow_dispatch land in the same group). When a newer run starts, any
# older active run is cancelled outright rather than being left to race it
# to the `git push` — cancellation surfaces as a cancelled run, not a false
# success, and the survivor's own actions/checkout step already pins it to
# its own triggering revision (issue #1016).
concurrency:
  group: metrics-writer
  cancel-in-progress: true

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip commits made by this workflow
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run metrics
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/latest.md docs/metrics/latest.json docs/metrics/badges/
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
          else
            git commit -m "chore: update metrics [skip ci]"
            git push
          fi
