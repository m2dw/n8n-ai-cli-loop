name: Metrics

on:
  push:
    branches: [main]

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip commits made by this workflow
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run metrics
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/latest.md docs/metrics/latest.json docs/metrics/badges/
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
          else
            git commit -m "chore: update metrics [skip ci]"
            git push
          fi
